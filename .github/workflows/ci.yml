# Full-build CI: builds and tests every module, including the NMS modules
# (v1_8_r1..v1_12_r1) and the shaded plugin module.
#
# The NMS modules depend on CraftBukkit server jars that are gitignored at
# HEAD but still exist in git history (untracked by commit 8e7f60d3). The
# job therefore checks out full history and runs build/get-dependencies.sh,
# which extracts those jars (SHA-256 verified) and installs them into the
# local Maven repository with a minimal POM. The minimal POM matters because
# the POM embedded in each jar declares org.spigotmc:minecraft-server, an
# artifact that no longer exists in any public Maven repository and that
# this build never compiles against (all classes the NMS modules need are
# inside the CraftBukkit jars).
name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history: the out-of-band craftbukkit jars live in history.
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        cache: maven

    - name: Install out-of-band CraftBukkit jars
      run: bash build/get-dependencies.sh

    - name: Build and test all modules
      run: mvn -B clean package --no-transfer-progress
