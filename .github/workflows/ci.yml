# Minimal Java CI.
#
# Scope warning: a green run here does NOT mean the whole repository builds.
# The NMS modules (v1_8_r1..v1_12_r1) depend on
# org.spigotmc:minecraft-server:1.8-SNAPSHOT, which no longer exists in any
# public Maven repository, and on CraftBukkit jars that must be placed in the
# repository root by hand (see build/get-dependencies.sh). Neither is
# committed, so those modules cannot be built on hosted runners. CI therefore
# only builds and tests the common module, which carries the full test suite
# and has no NMS dependencies.
name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        cache: maven

    - name: Build and test common module
      run: mvn -B test -pl common --no-transfer-progress
